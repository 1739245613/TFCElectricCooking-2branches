description = '''
TFC Electric Cooking / 群峦电力烹饪
中文简介
这是一个面向 TerraFirmaCraft 中后期流程的电力厨房扩展模组。它为 TFC + FirmaLife + Immersive Engineering 环境加入了两台可用电力驱动的高级厨房设备：电热烤箱与电热高压锅。

主要内容
- 电热烤箱：6 个输入槽，使用 Immersive Engineering 电力加热，兼容 TFC 加热配方与 FirmaLife 烤箱配方。
- 电热高压锅：5 个输入槽，支持流体与 TFC 锅类配方逻辑，提供独立液体显示、加工进度条和完成状态。
- 手动温度控制：电热烤箱支持 0 ~ 800°C 目标温度滑块，电热高压锅可在停止与 350°C 运行状态间切换。
- 能量参数：能量容量 16000 FE，基础耗电 20 FE/t，最大输入 / 输出 256 FE/t。
- 温度参数：通电时每 tick 向目标温度靠近 3°C，断电后每 tick 降温 1.5°C。
- 电热高压锅参数：预沸腾时间 100 ticks，正式烹饪阶段按 4x 速度推进。
- 开合交互：潜行右键可手动打开或关闭电热烤箱门与电热高压锅盖；打开 GUI 时会自动打开，关闭 GUI 时会自动关闭。
- 食物特性：电热烤箱产出的食物会附加 Electric Oven Baked / 烤箱烤制特性，腐败倍率为 0.9x。
- 新增电热高压锅专用配方：500 mB 水 + 1 个甜味剂可制作 500 mB FirmaLife 糖水；500 mB 糖水 + 单一水果可按水果数量制作果酱锅内输出。
- 新增蜂蜜转糖配方：FirmaLife 生蜂蜜和蜂蜜罐可合成为糖，蜂蜜罐依赖原物品的合成剩余物返还空罐。
- 装罐台自动化：FirmaLife 装罐台可自动输入空罐、输出成品，并可正对电热高压锅自动装取果酱；无盖空罐产出无盖果酱，带盖空罐产出密封果酱。
- JEI 兼容：电热烤箱会作为 TFC 加热与 FirmaLife 烤箱分类的催化设备显示；电热高压锅会作为 TFC / FirmaLife 锅类分类的催化设备显示。
- Jade 兼容：显示当前温度、电热高压锅待机 / 进度 / 完成状态等信息。

