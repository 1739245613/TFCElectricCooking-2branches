English Summary
TFC Electric Cooking is a mid-to-late-game electric kitchen expansion for TerraFirmaCraft, FirmaLife, and Immersive Engineering.
It adds two powered cooking appliances: the Electric Oven and the Electric Soup Pot.

Features
- Electric Oven: 6 input slots, powered by Immersive Engineering energy, compatible with TFC heating recipes and FirmaLife oven recipes.
- Electric Soup Pot: 5 input slots, supports fluid-based TFC pot recipe logic, with liquid display, progress bar, and finished state.
- Electric Oven target temperature control from 0 to 800°C; Electric Soup Pot run/stop control at 350°C.
- Energy capacity: 16000 FE.
- Base energy cost: 20 FE/t.
- Max energy input/output: 256 FE/t.
- Temperature change: +3°C/tick while powered toward the target, -1.5°C/tick while cooling.
- Soup pot pre-boil time: 100 ticks.
- Soup pot cooking progress speed: 4x.
- Sneak-right-click toggles the oven door or soup pot lid; opening the GUI opens it automatically and closing the GUI closes it automatically.
- Electric oven food output receives the Electric Oven Baked food trait with a 0.9x decay modifier.
- New Electric Soup Pot recipes: 500 mB water + 1 sweetener creates 500 mB FirmaLife sugar water; 500 mB sugar water + one kind of fruit creates jam output based on the fruit count.
- New honey-to-sugar recipes: FirmaLife raw honey and honey jars can be crafted into sugar; honey jars rely on their normal crafting remainder to return the empty jar.
- Jarring station automation: FirmaLife jarring stations can accept empty jars, output filled products, and automatically jar jam from a facing Electric Soup Pot. Empty jars create unsealed jam, while lidded jars create sealed jam.
- JEI integration: recipe catalyst support for matching TFC and FirmaLife cooking categories.
- Jade integration: current temperature, idle/progress/done status, and soup-pot progress display.

